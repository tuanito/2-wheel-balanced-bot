; ESP32-S3 real-time firmware for the balancing robot.
; Build/flash:  pio run -t upload      Serial monitor: pio device monitor -b 115200
; The controller itself (lib/botcore) is the same code that was validated in MuJoCo: run ./sync_core.sh after
; changing ../../core or re-running sim/design_lqr.py.

[env:esp32s3]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<bench/>
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi      ; DevKitC-1 N8R8 (octal PSRAM): GPIO 35-37 are not available
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1                ; USB-C port = debug console (Serial)

; The same robot image for the MF7015 build. The motor is chosen in TWO files - config.h's FITTED_MOTOR (the
; drive's half: Kt, what an iq command of 2048 means in amps) and core/motor.hpp's BOT_MOTOR_* (the
; controller's half: torque limit, speed ceiling, rotor inertia) - and main.cpp static_asserts that they agree,
; so this env exists to make the pair impossible to get half-right by hand. It is only a compile target: the
; committed gains, model and STLs are the mf6015 build (see ROBOT_MOTOR).
[env:esp32s3_mf7015]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -D FITTED_MOTOR=MOTOR_MF7015
    -D BOT_MOTOR_MF7015

; Hardware-in-the-loop build for Espressif QEMU (robot/hil/run_hil.py): same code, CAN + IMU over UART2 to the physics
; host, console on UART0 instead of USB CDC. Never flash this one to the robot.
[env:esp32s3_sim]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<bench/>
board_build.arduino.memory_type = dio_opi      ; QEMU flash model: DIO (the robot build keeps qio_opi)
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSIM_HIL

; Bench test with real CAN (bench/README.md): real ESP32-S3 + CAN board + USB-CAN adapter on the PC. The robot firmware
; with real TWAI; only the IMU comes from the PC's physics over the DevKit's "UART" USB port (921600), which also carries
; the Pi frames. The PC plays the two LK motors on the real bus (bench/bench_hil.py).
[env:esp32s3_bench]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<bench/>
monitor_speed = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBENCH_CAN

; CAN probe (src/bench/can_probe.cpp): transceiver self-test, motor scan, direction + encoder checks. USB port (CDC).
[env:esp32s3_canprobe]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_src_filter = -<*> +<bench/can_probe.cpp>
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1

; Test only: the bench build in QEMU (DIO flash), to check the PC <-> ESP32 serial side of bench/bench_hil.py.
[env:esp32s3_bench_qemu]
extends = env:esp32s3_bench
board_build.arduino.memory_type = dio_opi
build_flags =
    ${env:esp32s3_bench.build_flags}
    -DQEMU_NO_LEDC
